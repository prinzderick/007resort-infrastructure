# Managed by 007resort-infrastructure. HTTP-only vhost (used until a certificate exists).
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    include /etc/nginx/snippets/r007-app.conf;
}

# Loopback-only vhost used by deploy.sh health checks (never reachable from outside).
server {
    listen 127.0.0.1:8088;
    server_name localhost;
    include /etc/nginx/snippets/r007-app.conf;
}
