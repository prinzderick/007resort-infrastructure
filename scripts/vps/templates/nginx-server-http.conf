# Managed by 007resort-infrastructure. @@APP@@: HTTP-only server (used until a certificate exists: run `sudo r007-tls`).
server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAMES@@;

    # ACME HTTP-01 must stay reachable even with an allow-list / basic auth in front of the app.
    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        allow all;
        auth_basic off;
    }

    include @@NGINX_ETC@@/snippets/r007-@@APP@@-access.conf;
    include @@NGINX_ETC@@/snippets/r007-@@APP@@-body.conf;
}
