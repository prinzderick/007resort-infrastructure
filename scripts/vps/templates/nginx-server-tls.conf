# Managed by 007resort-infrastructure. @@APP@@: HTTPS server (certificate issued by certbot --webroot, see `r007-tls`).
server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAMES@@;

    location ^~ /.well-known/acme-challenge/ { root @@ACME_ROOT@@; }
    location / { return 301 https://@@DOMAIN@@$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @@DOMAIN@@;

    ssl_certificate     @@LE_DIR@@/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key @@LE_DIR@@/live/@@DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:r007_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS + security headers come from snippets/r007-<app>-headers.conf (included by the body).

    include @@NGINX_ETC@@/snippets/r007-@@APP@@-access.conf;
    include @@NGINX_ETC@@/snippets/r007-@@APP@@-body.conf;
}
