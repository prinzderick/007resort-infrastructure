; Managed by 007resort-infrastructure (scripts/vps/provision-stack.sh). API ONLY: the site and admin apps
; use QUEUE_CONNECTION=sync, define no scheduled commands and need no long-running workers.
; All long-running Laravel processes. Group "r007":  supervisorctl restart r007:*
; Graceful: queue workers finish the current job (stopwaitsecs) before stopping.

[group:r007]
programs=r007-queue,r007-sync,r007-reverb

[program:r007-queue]
command=/usr/bin/php artisan queue:work redis --queue=default --sleep=1 --tries=3 --backoff=5 --max-time=3600 --max-jobs=1000
directory=@@APP_DIR@@/current
user=@@APP_USER@@
umask=007
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/r007/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; Dedicated worker for the sync outbox/inbox queue (SYNC_QUEUE=sync).
[program:r007-sync]
command=/usr/bin/php artisan queue:work redis --queue=sync --sleep=1 --tries=5 --backoff=10 --max-time=3600 --max-jobs=1000
directory=@@APP_DIR@@/current
user=@@APP_USER@@
umask=007
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/r007/sync.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:r007-reverb]
command=/usr/bin/php artisan reverb:start --host=127.0.0.1 --port=8080
directory=@@APP_DIR@@/current
user=@@APP_USER@@
umask=007
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
stopwaitsecs=30
minfds=10000
redirect_stderr=true
stdout_logfile=/var/log/r007/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
