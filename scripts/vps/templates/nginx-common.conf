# Managed by 007resort-infrastructure. http-level settings shared by the api/site/admin server blocks.
# (No gzip/server_tokens here: Ubuntu's nginx.conf already sets gzip at http level and a duplicate is a config error;
#  those are set per server in snippets/r007-common.conf.)

# Long server names (admin.<domain>) overflow nginx's default 32-byte hash bucket and fail `nginx -t`.
server_names_hash_bucket_size 128;

# Bound the damage of a misbehaving peer/client (per source IP). Sync also has per-credential limits in the API.
limit_req_zone $binary_remote_addr zone=r007_sync:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=r007_api:10m rate=30r/s;
# Admin/portal login brute-force limit: only POSTs are keyed (an empty key is never limited). 10 attempts/min/IP.
map $request_method $r007_login_key { default ""; POST $binary_remote_addr; }
limit_req_zone $r007_login_key zone=r007_login:10m rate=10r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Requests for any name we do not serve (bare IP, stray DNS records) get nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    location ^~ /.well-known/acme-challenge/ { root @@ACME_ROOT@@; }
    location / { return 444; }
}
