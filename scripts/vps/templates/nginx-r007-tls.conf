# Managed by 007resort-infrastructure. HTTPS vhost (certificate issued by certbot --webroot).
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @@DOMAIN@@;

    ssl_certificate     /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:r007_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/r007-app.conf;
}

# Loopback-only vhost used by deploy.sh health checks (never reachable from outside).
server {
    listen 127.0.0.1:8088;
    server_name localhost;
    include /etc/nginx/snippets/r007-app.conf;
}
