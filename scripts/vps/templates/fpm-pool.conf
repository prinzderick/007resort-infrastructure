; Managed by 007resort-infrastructure (scripts/vps/provision-stack.sh). One pool + one system user per app.
[r007-@@APP@@]
user = @@APP_USER@@
group = @@APP_USER@@
listen = @@FPM_SOCK@@
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = @@PM_MAX_CHILDREN@@
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = @@PM_MAX_SPARE@@
pm.max_requests = 500
request_terminate_timeout = 65s
catch_workers_output = yes
security.limit_extensions = .php

; Upload limits are per app. api + admin accept CMS media (8 MB) - the admin portal forwards uploads to the API.
php_admin_value[upload_max_filesize] = @@UPLOAD_MAX@@
php_admin_value[post_max_size] = @@POST_MAX@@
php_admin_flag[expose_php] = off

; Optional filesystem jail (FPM_OPEN_BASEDIR=on in stack.env). Off by default until proven on the real app.
@@OB_PREFIX@@php_admin_value[open_basedir] = @@APP_DIR@@:/tmp:/usr/share/php:/dev/urandom
