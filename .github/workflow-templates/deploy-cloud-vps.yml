# TEMPLATE - copy into 007resort-api/.github/workflows/ (or use it as an organisation workflow template).
# Deploys a Laravel release to the Cloud node (Ubuntu VPS) over SSH using scripts installed by
# 007resort-infrastructure/scripts/vps/provision-stack.sh (/usr/local/bin/r007-deploy).
#
# NO values are committed. Create these in GitHub (Settings > Environments > cloud-production):
#   secrets:  VPS_HOST, VPS_USER (the deploy user), VPS_SSH_KEY (dedicated deploy key, private half),
#             VPS_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <host>`, verified out of band)
#   variables (optional): VPS_PORT (default 22)
# Protect the environment with required reviewers so a release needs a human approval.
name: Deploy Cloud node (VPS)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag/branch/sha) to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-cloud-vps
  cancel-in-progress: false

jobs:
  build:
    name: Build release package
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, redis, bcmath, zip, pcntl
          tools: composer:v2
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - name: Package
        id: pkg
        run: |
          name="r007-${GITHUB_SHA::12}.tar.gz"
          tar --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules --exclude='.env*' --exclude="$name" \
              -czf "$name" .
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ steps.pkg.outputs.name }}
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: cloud-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Configure SSH (pinned host key)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${opts[@]}" -P "$VPS_PORT" "$PACKAGE" "$VPS_USER@$VPS_HOST:/tmp/$PACKAGE"
          ssh "${opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "r007-deploy deploy --package /tmp/$PACKAGE && rm -f /tmp/$PACKAGE"
      - name: Remove key material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
