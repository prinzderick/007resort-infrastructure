name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: |
          docker compose -f compose/dev/docker-compose.yml --env-file compose/dev/.env.example config -q
          docker compose -f compose/dev/docker-compose.yml --env-file compose/dev/.env.example --profile reverb config -q

  yaml:
    name: YAML lint + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: yamllint (relaxed)
        run: |
          pip install --user yamllint
          yamllint -c .yamllint.yml .
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/*.yml .github/workflow-templates/*.yml

  shell:
    name: shellcheck + bash -n + dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -x scripts/lib/*.sh scripts/dev/*.sh scripts/vps/*.sh
      - name: bash -n
        run: for f in scripts/lib/*.sh scripts/dev/*.sh scripts/vps/*.sh; do bash -n "$f"; done
      - name: dry-run smoke tests
        run: |
          scripts/vps/bootstrap.sh --ssh-pubkey 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIexample ci' --dry-run
          scripts/vps/provision-stack.sh --api-domain api.example.com --site-domain example.com \
            --admin-domain admin.example.com --email ops@example.com --dry-run
          scripts/vps/provision-stack.sh --domain api.example.com --dry-run   # API-only / legacy flag
          scripts/vps/tls.sh --email ops@example.com --config env/stack.env.example --dry-run
          R007_STACK_ENV=env/stack.env.example scripts/vps/smoke.sh --mode local --dry-run
          R007_STACK_ENV=env/stack.env.example scripts/vps/deploy.sh all --api /tmp/a.tar.gz --site /tmp/s.tar.gz --admin /tmp/m.tar.gz --dry-run
          scripts/vps/backup.sh --dry-run --config /nonexistent
          scripts/vps/restore-test.sh --dry-run
          R007_API_DIR="$PWD" scripts/dev/local-node.sh up --dry-run

  nginx:
    name: nginx templates (nginx -t + routing test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nginx
        run: sudo apt-get update -y && sudo apt-get install -y nginx
      - name: Render every template and run nginx -t
        run: scripts/vps/check-nginx.sh --nginx /usr/sbin/nginx
      - name: Routing/limits/headers test against a running nginx
        run: scripts/vps/check-nginx.sh --nginx /usr/sbin/nginx --routes

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze scripts
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($r) { exit 1 }
      - name: Dry-run smoke test (non-Windows flow check)
        shell: pwsh
        run: |
          $env:R007_ROOT = "$PWD/.r007-test"
          ./scripts/windows/install.ps1 -DryRun
          ./scripts/windows/update.ps1 -Package ./r007-test.zip -DryRun

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
